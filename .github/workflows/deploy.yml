name: Deploy to GitHub Pages

on:
  # run on every push to main
  push:
    branches: [main]
  # allow running it by hand from the Actions tab
  workflow_dispatch:

# the token the workflow gets: read the code, publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# if two pushes land close together, only keep the newest deploy
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Install, build and upload dist/
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
